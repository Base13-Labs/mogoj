name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify SQLite FTS5
        run: python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('CREATE VIRTUAL TABLE t USING fts5(x)')"
      - name: Run unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell installer
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Validate PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path bin/mogoj.ps1), [ref]$null, [ref]$errors); if ($errors) { throw $errors }

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Standard-library line coverage summary
        run: python -m trace --count --missing --summary --coverdir=/tmp/mogoj-coverage --ignore-dir=${{ runner.tool_cache }} --module unittest discover -s tests
